{{- if .Values.eventWebhook.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "authentik-operator.fullname" . }}-webhook-cleanup
  labels:
    {{- include "authentik-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "authentik-operator.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "authentik-operator.serviceAccountName" . }}
      containers:
        - name: cleanup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /manager
          args:
            - --cleanup-event-webhooks
          env:
            - name: AUTHENTIK_URL
              value: {{ required "authentik.url is required" .Values.authentik.url | quote }}
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "authentik.existingSecret.name is required" .Values.authentik.existingSecret.name }}
                  key: {{ .Values.authentik.existingSecret.key }}
  backoffLimit: 1
{{- end }}
