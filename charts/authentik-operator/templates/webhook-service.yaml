{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authentik-operator.fullname" . }}-webhook
  labels:
    {{- include "authentik-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "authentik-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
