suite: service account
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders by default
    set:
      authentik.url: https://auth.example.com
      authentik.existingSecret.name: my-secret
    asserts:
      - isKind:
          of: ServiceAccount

  - it: uses custom name when specified
    set:
      authentik.url: https://auth.example.com
      authentik.existingSecret.name: my-secret
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: applies custom annotations
    set:
      authentik.url: https://auth.example.com
      authentik.existingSecret.name: my-secret
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::role/my-role
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::role/my-role
