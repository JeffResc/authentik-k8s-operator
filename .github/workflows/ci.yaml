name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4

      - name: Copy CRDs to Helm chart
        run: cp config/crd/bases/*.yaml charts/authentik-operator/crds/

      - name: Lint Helm chart
        run: |
          helm lint charts/authentik-operator \
            --set authentik.url=https://test.example.com \
            --set authentik.existingSecret.name=test-secret

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2 --verify=false

      - name: Run Helm unit tests
        run: helm unittest charts/authentik-operator

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      - name: Check generated files are up-to-date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate manifests' and commit."
            exit 1
          fi

      - name: Build binary
        run: go build -o bin/manager cmd/main.go

      - name: Run tests
        run: go test -race ./... -v -coverprofile=coverage.out

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold of 60%"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

  deadcode:
    name: Deadcode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.7'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.30.0
          OUTPUT=$(deadcode -test ./...)
          if [ -n "$OUTPUT" ]; then
            echo "::error::deadcode found unreachable code:"
            echo "$OUTPUT"
            exit 1
          fi

